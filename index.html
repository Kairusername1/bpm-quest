.hp{height:100%;background:#d32f2f;transition:width .5s}
.bar span{position:absolute;left:6px;top:0;line-height:24px;font-size:.85rem;font-weight:bold;color:#fff;text-shadow:1px 1px 0 #000}
.st{font-size:.85rem;margin:4px 0}
.q{font-size:1.05rem;font-weight:bold;margin:10px 0}
.slot{padding:4px 8px;margin:4px 0;border:2px dashed var(--bd);font-size:.9rem}.slot.on{border-style:solid;background:var(--card)}
.boss{color:var(--bad);font-weight:bold;margin:10px 0 0}
#msg{min-height:1.5em;margin:6px 0}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes drop{0%{transform:translate(-50%,-80px)}12%,80%{transform:translate(-50%,0)}100%{transform:translate(-50%,-80px)}}
.b,.q,.slot.on{animation:pop .3s backwards}
.b.bad{animation:wob .35s}.b.ok{animation:pulse .4s}
.shk{animation:shk .35s}h1{animation:bob 1.6s ease-in-out infinite}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);background:#ffd23f;color:#241c14;border:3px solid #241c14;padding:8px 16px;font-weight:bold;z-index:9;animation:drop 2.2s both}
canvas{touch-action:manipulation;-webkit-user-select:none;user-select:none}.b{font-size:.92rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.grid .b{margin:4px 0}
h2{font-size:1.05rem;margin:6px 0 2px}.q{font-size:.95rem;margin:6px 0}.st{font-size:.78rem;margin:2px 0}.bar{height:20px;margin-top:4px}.bar span{line-height:20px;font-size:.75rem}
input{padding:8px;margin:4px 0}small{font-size:.75rem}.slot{padding:2px 8px;margin:3px 0;font-size:.82rem}#msg{margin:4px 0}
body::before{content:"";position:fixed;inset:0;z-index:-1;background-color:var(--s1);background-image:var(--l4),var(--l3),var(--l2),var(--l1),linear-gradient(var(--s1),var(--s2));background-repeat:repeat-x,repeat-x,repeat-x,repeat-x,no-repeat;background-position:0 100%,0 100%,0 100%,0 6%,0 0;background-size:320px 80px,480px 90px,480px 120px,480px 60px,100% 100%;image-rendering:pixelated;animation:para 60s linear infinite}
@keyframes para{to{background-position:-2560px 100%,-1440px 100%,-480px 100%,-960px 6%,0 0}}
#ui{margin-top:8px;padding:4px 8px 6px;background:color-mix(in srgb,var(--bg) 88%,transparent);border:3px solid var(--bd)}
@media(prefers-reduced-motion:reduce){body::before{animation:none!important}*{animation:none!important;transition:none!important}}
@media(hover:hover){.b:not(:disabled):hover{background:#ffd23f;color:#241c14;box-shadow:5px 5px 0 var(--bd);transform:translate(-1px,-1px)}}
.b:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--bd)}
#cr{position:fixed;left:0;top:0;z-index:-1;pointer-events:none;white-space:nowrap;font:bold 14px "Courier New",monospace;color:#ffd23f;text-shadow:2px 2px 0 rgba(0,0,0,.65);will-change:transform}
